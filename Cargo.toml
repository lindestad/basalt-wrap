[package]
name = "strata-wrap"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Strata inference console and elastic VRAM supervisor"
license = "MIT"
repository = "https://github.com/lindestad/strata-wrap"
homepage = "https://github.com/lindestad/strata-wrap"
readme = "README.md"
keywords = ["strata", "llm", "tui", "vram", "inference"]
categories = ["command-line-utilities"]
include = ["src/**", "tests/**", "docs/*.png", "README.md", "AI_SETUP.md", "CONTRIBUTING.md", "CHANGELOG.md", "examples/*.json", "LICENSE", "Cargo.toml", "Cargo.lock"]

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
libc = "0.2"
nvml-wrapper = { version = "0.13", features = ["legacy-functions"] }
ratatui = "0.30.2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
signal-hook = "0.4"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"

[profile.release]
lto = "thin"
strip = true
