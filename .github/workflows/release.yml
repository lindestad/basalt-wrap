name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
      - name: Verify tag matches crate version
        shell: bash
        run: |
          crate_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v${crate_version}" = "${GITHUB_REF_NAME}"
      - name: Start systemd user manager for lifecycle tests
        shell: bash
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - run: cargo test --locked
      - run: cargo publish --dry-run --locked
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/crate-check

  build:
    needs: verify
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target "$TARGET"
      - name: Package Linux binary
        run: |
          mkdir dist
          cp "target/${TARGET}/release/strata-wrap" README.md LICENSE dist/
          tar -C dist -czf "strata-wrap-${GITHUB_REF_NAME}-${TARGET}.tar.gz" strata-wrap README.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: strata-wrap-linux
          path: strata-wrap-${{ github.ref_name }}-*.tar.gz

  publish-crate:
    needs: verify
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Check for an existing crate version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          status=$(curl --silent --show-error --retry 3 --output /tmp/crate-version.json \
            --write-out '%{http_code}' --user-agent 'strata-wrap-release (https://github.com/lindestad/strata-wrap)' \
            "https://crates.io/api/v1/crates/strata-wrap/${version}")
          case "$status" in
            200) echo 'published=true' >> "$GITHUB_OUTPUT" ;;
            404) echo 'published=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "Registry returned HTTP ${status}" >&2; exit 1 ;;
          esac
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.version.outputs.published != 'true'
        id: auth
      - run: cargo publish --locked
        if: steps.version.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    needs: [build, publish-crate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
